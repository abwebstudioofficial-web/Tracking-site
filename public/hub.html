<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Hub · Transport Hub</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme.js"></script>
</head>
<body class="hub-page">
  <header class="hub-top">
    <div class="brand">
      <div class="brand-mark"><img src="/img/logo.png" alt="Transport Hub logo"></div>
      <div>Transport Hub<small id="top-company">Loads · Trucks · Tracking</small></div>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost" id="to-fleet" href="/admin" hidden>Fleet map</a>
      <button class="btn btn-ghost bell" id="bell" title="Alerts" aria-label="Alerts" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bell-count" hidden>0</span>
      </button>
      <button class="btn btn-ghost" id="logout">Sign out</button>
    </div>
  </header>
  <main class="hub" id="main">
    <p class="hint">Loading… · لوڈ ہو رہا ہے</p>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/googlemap.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/wallet.js"></script>
  <script src="/js/loads.js"></script>
  <script src="/js/fleet.js"></script>
  <script src="/js/hub.js"></script>
</body>
</html>
