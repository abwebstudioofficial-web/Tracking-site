<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Admin · Ibraya Logistics Tracking</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme.js"></script>
</head>
<body class="admin-page">
  <div class="admin">
    <aside class="sidebar" id="sidebar">
      <header>
        <div class="brand">
          <div class="brand-mark"><img src="/img/logo.png" alt="Ibraya Logistics logo"></div>
          <div>Ibraya Logistics<small>Admin · Live tracking</small></div>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost toggle-list" id="toggle">Drivers</button>
          <button class="btn btn-ghost bell" id="bell" title="Alerts" aria-label="Alerts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="bell-count" id="bell-count" hidden>0</span>
          </button>
          <button class="btn btn-ghost" id="logout">Sign out</button>
        </div>
      </header>

      <div class="panel" id="view-fleet">
        <div class="stats">
          <div class="stat"><b id="s-total">0</b><span>Drivers</span></div>
          <div class="stat"><b id="s-active">0</b><span>Active</span></div>
          <div class="stat"><b id="s-idle">0</b><span>Idle</span></div>
        </div>
        <div class="search"><input id="search" placeholder="Search name, phone or email"></div>
        <div class="list" id="list"></div>
      </div>

      <div class="panel" id="view-alerts" hidden>
        <div class="panel-head">
          <button class="btn btn-ghost" data-back>← Drivers</button>
          <h2>Alerts</h2>
          <button class="btn btn-ghost" id="sound-toggle" title="Alert sound"></button>
        </div>
        <div class="list">
          <h3 class="list-title">Now</h3>
          <div id="alerts-now"></div>
          <h3 class="list-title">Last 24 hours</h3>
          <div id="alerts-earlier"></div>
        </div>
      </div>

      <div class="panel" id="view-history" hidden>
        <div class="panel-head">
          <button class="btn btn-ghost" data-back>← Drivers</button>
          <h2 id="history-name"></h2>
        </div>
        <div class="day-picker">
          <button class="btn btn-ghost" id="day-prev" aria-label="Previous day">‹</button>
          <input type="date" id="day">
          <button class="btn btn-ghost" id="day-next" aria-label="Next day">›</button>
        </div>
        <div class="stats stats-4" id="history-summary"></div>
        <div class="list" id="history-list"></div>
      </div>
    </aside>
    <section class="map-wrap"><div id="map"></div></section>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/maplibre/maplibre-gl.js"></script>
  <script src="/vendor/maplibre-leaflet.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
