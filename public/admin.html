<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Admin · Ibraya Logistics Tracking</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme.js"></script>
</head>
<body class="admin-page">
  <div class="admin">
    <aside class="sidebar" id="sidebar">
      <header>
        <div class="brand">
          <div class="brand-mark"><img src="/img/logo.png" alt="Ibraya Logistics logo"></div>
          <div>Ibraya Logistics<small>Admin · Live tracking</small></div>
        </div>
        <div>
          <button class="btn btn-ghost toggle-list" id="toggle">Drivers</button>
          <button class="btn btn-ghost" id="logout">Sign out</button>
        </div>
      </header>
      <div class="stats">
        <div class="stat"><b id="s-total">0</b><span>Drivers</span></div>
        <div class="stat"><b id="s-active">0</b><span>Active</span></div>
        <div class="stat"><b id="s-idle">0</b><span>Idle</span></div>
      </div>
      <div class="search"><input id="search" placeholder="Search name, phone or email"></div>
      <div class="list" id="list"></div>
    </aside>
    <section class="map-wrap"><div id="map"></div></section>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
