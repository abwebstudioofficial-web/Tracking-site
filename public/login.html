<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in · Ibraya Logistics Tracking</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="center-page">
    <div class="card">
      <div class="brand">
        <div class="brand-mark"><img src="/img/logo.png" alt="Ibraya Logistics logo"></div>
        <div>Ibraya Logistics<small>Tracking</small></div>
      </div>

      <div class="tabs">
        <button type="button" data-mode="login" class="active">Sign in</button>
        <button type="button" data-mode="register">Create account</button>
      </div>

      <form id="form" novalidate>
        <label class="field" id="name-field" hidden>
          <span>Full name</span>
          <input name="name" autocomplete="name" placeholder="e.g. Muhammad Ali">
        </label>
        <label class="field">
          <span>Phone number</span>
          <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+92 300 1234567" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" required>
        </label>
        <div class="error" id="error"></div>
        <button class="btn" id="submit">Sign in</button>
      </form>
      <div id="google-area" hidden>
        <div class="divider"><span>or</span></div>
        <div id="google-btn" class="google-btn"></div>
      </div>

      <form id="google-phone-form" hidden novalidate>
        <p class="hint" style="margin-top:0">One last step: add the phone number you carry while driving.</p>
        <label class="field">
          <span>Full name</span>
          <input name="name" autocomplete="name">
        </label>
        <label class="field">
          <span>Phone number</span>
          <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+92 300 1234567" required>
        </label>
        <div class="error" id="google-error"></div>
        <button class="btn" id="google-submit">Continue</button>
      </form>
      <p class="hint" id="hint">Drivers: sign in with the phone number you registered with.</p>
    </div>
  </main>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="/js/login.js"></script>
</body>
</html>
