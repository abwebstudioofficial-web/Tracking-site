<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Ibraya Logistics Tracking</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="center-page">
    <div class="card">
      <div class="brand">
        <div class="brand-mark"><img src="/img/logo.png" alt="Ibraya Logistics logo"></div>
        <div>Ibraya Logistics<small>Tracking</small></div>
      </div>

      <div class="role-display">
        <div class="label">Your role</div>
        <div class="role" id="role">…</div>
        <div class="who" id="who"></div>
      </div>

      <div class="status"><span class="dot" id="dot"></span><span id="status">Starting location…</span></div>

      <button class="btn" id="enable" hidden>Turn on location</button>
      <p class="hint" id="keep-open">Keep this page open while driving.</p>

      <!-- Android browser: point drivers to the app for 24/7 tracking -->
      <a class="get-app" id="get-app" href="/download" hidden>
        <b>Get the Ibraya app for 24/7 tracking</b>
        <span>Tracks even with the screen off · اسکرین بند ہونے پر بھی ٹریکنگ</span>
      </a>

      <!-- Inside the app: one-time setup checklist -->
      <section class="setup" id="app-setup" hidden>
        <h2 class="setup-title">Finish setup · سیٹ اپ مکمل کریں</h2>
        <ol class="steps" id="steps"></ol>
      </section>
      <p style="text-align:center;margin-top:18px"><a class="btn btn-ghost" id="to-admin" href="/admin" hidden>← Admin map</a> <button class="btn-ghost btn" id="logout">Sign out</button></p>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/brands.js"></script>
  <script src="/js/driver.js"></script>
</body>
</html>
