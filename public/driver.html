<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Ibraya Logistics Tracking</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="center-page">
    <div class="card">
      <div class="brand">
        <div class="brand-mark"><img src="/img/logo.png" alt="Ibraya Logistics logo"></div>
        <div>Ibraya Logistics<small>Tracking</small></div>
      </div>

      <div class="role-display">
        <div class="label">Your role</div>
        <div class="role" id="role">…</div>
        <div class="who" id="who"></div>
      </div>

      <div class="status"><span class="dot" id="dot"></span><span id="status">Starting location…</span></div>

      <button class="btn" id="enable" hidden>Turn on location</button>
      <p class="hint">Keep this page open while driving.</p>
      <p style="text-align:center;margin-top:18px"><button class="btn-ghost btn" id="logout">Sign out</button></p>
    </div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/driver.js"></script>
</body>
</html>
