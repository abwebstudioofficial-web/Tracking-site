<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1418">
  <title>Ibraya Logistics Tracking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="center-page">
    <div class="card">
      <div class="brand">
        <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h13v11H1z"/><path d="M14 8h4l4 4v3h-8z"/><circle cx="5.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg></div>
        <div>Ibraya Logistics<small>Tracking</small></div>
      </div>

      <div class="role-display">
        <div class="label">Your role</div>
        <div class="role" id="role">…</div>
        <div class="who" id="who"></div>
      </div>

      <div class="status"><span class="dot" id="dot"></span><span id="status">Starting location…</span></div>

      <button class="btn" id="enable" hidden>Turn on location</button>
      <p class="hint">Keep this page open while driving.</p>
      <p style="text-align:center;margin-top:18px"><button class="btn-ghost btn" id="logout">Sign out</button></p>
    </div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/driver.js"></script>
</body>
</html>
