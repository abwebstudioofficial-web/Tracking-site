<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transport Hub</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f4fb; color: #1b1530;
           font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #e0ddf0; border-radius: 20px; padding: 28px 22px; max-width: 360px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #64717d; margin: 0 0 18px; }
    button { border: 0; border-radius: 12px; padding: 14px 18px; font: 600 16px system-ui; background: linear-gradient(135deg, #7400b8, #5e60ce); color: #fff; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No internet connection</h1>
    <p>Location tracking keeps running in the background.<br>انٹرنیٹ نہیں ہے۔ ٹریکنگ پس منظر میں جاری ہے۔</p>
    <button onclick="location.replace('https://tracking-site.up.railway.app/login')">Try again · دوبارہ کوشش کریں</button>
  </div>
</body>
</html>
